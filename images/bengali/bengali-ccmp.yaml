name: bengali-half
GENERATOR: hb-view
SCRIPTFONT: TiroBangla-Regular.ttf
basecolor: #000000
components:
- before:
    unicodes: 09dd
    options: --preserve-default-ignorables
    margin: 2,16,2,16
    features: -init
- arrow:
    file: right-arrow.svg
- after:
    # the 09dd glyph is already two components; the decomposition is
    # illustratable purely through CSS classes as a result.
    unicodes: 09dd 
    margin: 2,16,2,16
    features: -init
